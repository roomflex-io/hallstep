<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Create account — The Wedding Company</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">The Wedding Company<small>A path to unity</small></a>
      <nav class="links"><a href="login.html" class="login-link">Log in</a></nav>
    </div>
  </header>
  <main class="page wrap">
    <p class="sans" style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#8b3e2f">Sign up</p>
    <h1 style="opacity:1;animation:none;max-width:14ch" id="title">Create account</h1>
    <p class="lede" id="lede"></p>
    <form id="su">
      <div><label for="name">Name</label><input id="name" required /></div>
      <div><label for="email">Email</label><input id="email" type="email" required /></div>
      <div><label for="password">Password</label><input id="password" type="password" minlength="8" required /></div>
      <button class="btn solid ready" type="submit">Create account</button>
      <p class="notice" id="msg"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const role = new URLSearchParams(location.search).get("role") === "provider" ? "provider" : "couple";
    title.textContent = role === "provider" ? "Provider account" : "Couple account";
    lede.textContent = role === "provider" ? "You will then fill in the listing." : "Your wedding plan will live here.";
    su.onsubmit = async function (e) {
      e.preventDefault();
      msg.textContent = "Creating account…";
      try {
        const sb = await twcClient();
        const { data, error } = await sb.auth.signUp({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          options: {
            data: {
              full_name: document.getElementById("name").value.trim(),
              role: role
            }
          }
        });
        if (error) throw error;
        if (data.session) {
          location.href = role === "provider" ? "provider-setup.html" : "couple.html";
        } else {
          msg.textContent = "Check your email to confirm the account, then log in.";
        }
      } catch (ex) {
        msg.textContent = ex.message || "Could not create account";
      }
    };
  </script>
</body>
</html>
