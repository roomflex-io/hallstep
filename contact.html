<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1713" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Contact — The Wedding Company</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">The Wedding Company<small>Planning studio</small></a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </header>
  <main class="page wrap">
    <p class="sans" style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#8b3e2f">Contact</p>
    <h1 style="font-size:clamp(34px,8vw,56px);font-weight:500;line-height:1">Talk to us</h1>
    <p class="lede">Questions about planning, working together, or the studio. We read everything.</p>
    <form action="mailto:hello@example.com" method="get" enctype="text/plain">
      <div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required /></div>
      <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
      <div><label for="message">Message</label><textarea id="message" name="body" rows="6" required></textarea></div>
      <button class="btn solid" type="submit" style="opacity:1;animation:none">Send message</button>
    </form>
    <p class="lede" style="margin-top:18px">Or email <a href="mailto:hello@example.com"><u>hello@example.com</u></a> — swap this when the real address is ready.</p>
  </main>
  <footer class="wrap"><span>The Wedding Company</span><span><a href="privacy.html">Privacy</a></span></footer>
  <script src="app.js"></script>
</body>
</html>
