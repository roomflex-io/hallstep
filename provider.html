<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Provider — The Wedding Company</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">The Wedding Company<small>A path to unity</small></a>
      <nav class="links">
        <a href="providers.html">Providers</a>
        <a href="login.html" class="login-link">Log in</a>
      </nav>
    </div>
  </header>
  <div id="root"></div>
  <footer class="wrap"><span>The Wedding Company</span><span><a href="privacy.html">Privacy</a></span></footer>
  <script src="providers-data.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id") || PROVIDERS[0].id;
    const p = PROVIDERS.find(x => x.id === id) || PROVIDERS[0];
    document.title = p.name + " — The Wedding Company";
    root.innerHTML = `
      <section class="hero short">
        <img src="${p.photos[0]}" alt="">
        <div class="shade"></div>
        <div class="hero-copy">
          <p class="kicker">${p.services.join(" · ")}</p>
          <h1>${p.name}</h1>
          <p class="sub">${p.city}</p>
        </div>
      </section>
      <main class="page wrap">
        <div class="gallery">
          ${p.photos.map((src,i)=>`<div class="${i===0?"tall":""}"><img src="${src}" alt=""></div>`).join("")}
        </div>
        ${p.video ? `<div style="margin-top:16px;border-radius:16px;overflow:hidden;aspect-ratio:16/9"><iframe width="100%" height="100%" src="${p.video}" title="Video" frameborder="0" allowfullscreen></iframe></div>` : ""}
        <div class="legal" style="max-width:60ch;margin-top:22px"><p>${p.about}</p></div>
        <div class="facts">
          <div class="fact"><b>Address</b>${p.address}</div>
          <div class="fact"><b>Main contact</b>${p.contact}<br>${p.phone}<br>${p.email}</div>
          <div class="fact"><b>Capacity</b>${p.capacity}</div>
          <div class="fact"><b>Price</b>${p.priceFrom}</div>
          <div class="fact"><b>Ceremony</b>${p.ceremony}</div>
          <div class="fact"><b>Parking</b>${p.parking}</div>
          <div class="fact"><b>Spaces</b>${p.rooms}</div>
          <div class="fact"><b>Food</b>${p.catering}</div>
          <div class="fact"><b>Access</b>${p.access}</div>
          <div class="fact"><b>When to book</b>${p.lead}<br>${p.days}</div>
        </div>
        <p class="lede">Send an enquiry. They confirm the booking — nothing is locked until they do.</p>
        <a class="btn solid ready" href="contact.html">Send an enquiry</a>
      </main>`;
  </script>
  <script src="app.js"></script>
</body>
</html>
