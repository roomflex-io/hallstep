<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Providers — The Wedding Company</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">The Wedding Company<small>A path to unity</small></a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="providers.html" aria-current="page">Providers</a>
        <a href="login.html" class="login-link">Log in</a>
      </nav>
    </div>
  </header>
  <main class="page wrap">
    <p class="sans" style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#8b3e2f">Birmingham first</p>
    <h1 style="opacity:1;animation:none;max-width:18ch">Halls and mosques</h1>
    <p class="lede">Public listings for Birmingham. Unclaimed — the venue has not logged in yet. Capacities and phones are from published pages and must be confirmed.</p>
    <div class="cards" id="list" style="margin-top:22px"></div>
  </main>
  <footer class="wrap"><span>The Wedding Company</span></footer>
  <script src="providers-data.js"></script>
  <script>
    list.innerHTML = PROVIDERS.map(p => `<a class="card in door" href="provider.html?id=${p.id}"><h3>${p.name}</h3><p>${p.address}<br>${p.services.join(", ")}<br>${p.capacity}</p></a>`).join("");
  </script>
  <script src="app.js"></script>
</body>
</html>
