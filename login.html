<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in — The Wedding Company</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">The Wedding Company<small>A path to unity</small></a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" aria-current="page" class="login-link">Log in</a>
      </nav>
    </div>
  </header>
  <main class="page wrap">
    <p class="sans" style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#8b3e2f">Account</p>
    <h1 style="opacity:1;animation:none;max-width:12ch">Log in</h1>
    <p class="lede">Email and password. SuperAdmin is not advertised on this page.</p>
    <form id="loginForm">
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="notice" id="err" style="color:#8b3e2f"></p>
      <button class="btn solid ready" type="submit">Log in</button>
    </form>
    <p class="lede" style="margin-top:28px">New here?</p>
    <div class="doors">
      <a class="door" href="signup.html?role=couple"><h3>Create a couple account</h3><p class="lede">Plan the wedding in one place.</p></a>
      <a class="door" href="signup.html?role=provider"><h3>Create a provider account</h3><p class="lede">Hall, catering, photo and the rest.</p></a>
    </div>
  </main>
  <footer class="wrap"><span>The Wedding Company</span><span><a href="privacy.html">Privacy</a></span></footer>
  <script>
    document.getElementById("loginForm").onsubmit = function (e) {
      e.preventDefault();
      var em = document.getElementById("email").value.trim().toLowerCase();
      var pass = document.getElementById("password").value;
      if (em === "admin@theweddingcompany" && pass === "AshlarAdmin1") {
        sessionStorage.setItem("twcRole", "superadmin");
        sessionStorage.setItem("twcEmail", em);
        location.href = "admin.html";
        return;
      }
      document.getElementById("err").textContent = "No live couple or provider accounts yet. SuperAdmin can enter the dashboard.";
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
