<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in — The Wedding Company</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">The Wedding Company<small>A path to unity</small></a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" aria-current="page" class="login-link">Log in</a>
      </nav>
    </div>
  </header>
  <main class="page wrap">
    <p class="sans" style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#8b3e2f">Account</p>
    <h1 style="opacity:1;animation:none;max-width:12ch">Log in</h1>
    <form id="loginForm">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required /></div>
      <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required /></div>
      <p class="notice" id="err" style="color:#8b3e2f"></p>
      <button class="btn solid ready" type="submit">Log in</button>
    </form>
    <p class="lede" style="margin-top:28px">New here?</p>
    <div class="doors">
      <a class="door" href="signup.html?role=couple"><h3>Create a couple account</h3><p class="lede">Plan the wedding in one place.</p></a>
      <a class="door" href="signup.html?role=provider"><h3>Create a provider account</h3><p class="lede">Hall, catering, photo and the rest.</p></a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById("loginForm").onsubmit = async function (e) {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "Signing in…";
      try {
        const sb = await twcClient();
        const { data, error } = await sb.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });
        if (error) throw error;
        const { data: profile } = await sb.from("profiles").select("role").eq("id", data.user.id).single();
        const role = profile && profile.role;
        if (role === "superadmin") location.href = "admin.html";
        else if (role === "provider") location.href = "provider-setup.html";
        else location.href = "couple.html";
      } catch (ex) {
        err.textContent = ex.message || "Could not sign in";
      }
    };
  </script>
</body>
</html>
